name: Android

on:
  push:
    branches: [main, 'm*-*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabletop/client build
        env:
          # Public game server offered by default (repository variable, optional).
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - name: Copy the web app into the Android project
        working-directory: apps/client
        run: pnpm exec cap sync android
      - name: Build the debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tabletop-mobile-debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
